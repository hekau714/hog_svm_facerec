<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Face Detector WS</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2c;
      --panel-soft: #0f1726;
      --ink: #edf2ff;
      --muted: #9fb0d2;
      --good: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --accent: #06b6d4;
      --border: #24354f;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 80% -20%, #12365f55 0%, transparent 60%),
        radial-gradient(900px 500px at -10% 20%, #04748133 0%, transparent 65%),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "SF Pro Text", Tahoma, sans-serif;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }
    .hero {
      margin-bottom: 10px;
    }
    .title {
      margin: 0 0 4px 0;
      font-size: clamp(22px, 4.2vw, 34px);
      line-height: 1.1;
      letter-spacing: 0.2px;
    }
    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .ios-note {
      margin-top: 10px;
      border: 1px solid #664a00;
      background: #2c230f;
      color: #fcd34d;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
    .toolbar {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .toolbar button,
    .toolbar input,
    .toolbar select {
      width: 100%;
      min-height: 46px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
      padding: 10px 12px;
      font-size: 15px;
    }
    .toolbar button {
      font-weight: 600;
      cursor: pointer;
    }
    .toolbar button.primary {
      background: linear-gradient(180deg, #0ea5e9, #0284c7);
      border-color: #0ea5e9;
    }
    .toolbar button.stop {
      background: linear-gradient(180deg, #ef4444, #dc2626);
      border-color: #f87171;
    }
    .toolbar button.secondary {
      background: linear-gradient(180deg, #334155, #1e293b);
    }
    .controls {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .field {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .field label {
      color: var(--muted);
      font-size: 13px;
    }
    .field input {
      width: 110px;
      text-align: right;
      background: #0f1b2f;
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: 8px;
      padding: 6px 8px;
      min-height: 36px;
      font-size: 14px;
    }
    .panel {
      margin-top: 12px;
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: calc(100vh - 320px);
      min-height: 280px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    video, canvas, .photo-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .status-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-soft);
      padding: 8px 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .ok { color: var(--good); }
    .warn { color: var(--warn); }
    .err { color: var(--danger); }
    .small {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    @media (min-width: 760px) {
      .toolbar {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .controls {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .panel {
        aspect-ratio: 16 / 10;
        min-height: 360px;
      }
      .status-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1 class="title">Realtime Face Detection</h1>
      <p class="sub">Camera frame -> JPEG (150px width) -> WebSocket -> Python model -> boxes</p>
      <div id="iosNote" class="ios-note"></div>
    </div>

    <div class="toolbar">
      <button id="startBtn" class="primary">Start Camera</button>
      <button id="switchBtn" class="secondary">Switch Front/Back</button>
      <button id="stopBtn" class="stop">Stop</button>
      <button id="photoBtn" class="secondary">Use Photo</button>
      <input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none" />
    </div>

    <div class="controls">
      <div class="field">
        <label for="speedProfile">Speed profile</label>
        <select id="speedProfile">
          <option value="turbo">turbo (fastest)</option>
          <option value="balanced" selected>balanced</option>
          <option value="quality">quality (best recall)</option>
        </select>
      </div>
      <div class="field">
        <label for="qualityInput">JPEG quality</label>
        <input id="qualityInput" type="number" min="0.3" max="1" step="0.05" value="0.85" />
      </div>
      <div class="field">
        <label for="intervalInput">Send every (ms)</label>
        <input id="intervalInput" type="number" min="80" max="2000" step="20" value="220" />
      </div>
      <div class="field">
        <label for="scoreInput">Score threshold</label>
        <input id="scoreInput" type="number" min="0.5" max="3.0" step="0.1" value="1.5" />
      </div>
      <div class="field">
        <label for="recognitionThresholdInput">Recognition threshold</label>
        <input id="recognitionThresholdInput" type="number" min="0.10" max="0.99" step="0.01" value="0.58" />
      </div>
      <div class="field">
        <label for="recognitionMarginInput">Recognition margin</label>
        <input id="recognitionMarginInput" type="number" min="0.00" max="0.50" step="0.01" value="0.16" />
      </div>
    </div>

    <div class="panel">
      <video id="video" autoplay playsinline muted></video>
      <img id="photoPreview" class="photo-preview" alt="photo preview" style="display:none;" />
      <canvas id="overlay"></canvas>
    </div>

    <div class="status-grid">
      <div id="connStatus" class="status-item warn">WS: disconnected</div>
      <div id="fpsStatus" class="status-item">Send FPS: 0</div>
      <div id="inferStatus" class="status-item">Inference: - ms</div>
      <div id="detStatus" class="status-item">Detections: 0</div>
      <div id="scoreThrStatus" class="status-item">Score thr: 1.5</div>
    </div>
    <div id="hint" class="small"></div>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const switchBtn = document.getElementById("switchBtn");
    const stopBtn = document.getElementById("stopBtn");
    const photoBtn = document.getElementById("photoBtn");
    const photoInput = document.getElementById("photoInput");
    const video = document.getElementById("video");
    const photoPreview = document.getElementById("photoPreview");
    const overlay = document.getElementById("overlay");
    const ctx = overlay.getContext("2d");
    const qualityInput = document.getElementById("qualityInput");
    const intervalInput = document.getElementById("intervalInput");
    const scoreInput = document.getElementById("scoreInput");
    const recognitionThresholdInput = document.getElementById("recognitionThresholdInput");
    const recognitionMarginInput = document.getElementById("recognitionMarginInput");
    const speedProfile = document.getElementById("speedProfile");
    const connStatus = document.getElementById("connStatus");
    const fpsStatus = document.getElementById("fpsStatus");
    const inferStatus = document.getElementById("inferStatus");
    const detStatus = document.getElementById("detStatus");
    const scoreThrStatus = document.getElementById("scoreThrStatus");
    const iosNote = document.getElementById("iosNote");
    const hint = document.getElementById("hint");

    let ws = null;
    let stream = null;
    let timer = null;
    let frameId = 0;
    let sent = 0;
    let fpsClock = performance.now();
    let lastBoxes = [];
    let shouldRun = false;
    let reconnectTimer = null;
    let inFlight = false;
    let latestFrameDataUrl = null;
    let latestOrigWidth = 0;
    let latestOrigHeight = 0;
    let currentFacingMode = "user";

    const captureCanvas = document.createElement("canvas");
    const cctx = captureCanvas.getContext("2d");
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      return `${proto}://${location.host}/ws`;
    }

    function showIOSHints() {
      if (!isIOS) return;
      iosNote.style.display = "block";
      if (!window.isSecureContext && location.hostname !== "localhost") {
        iosNote.textContent = "iOS Safari camera usually needs HTTPS on LAN. Open this site over HTTPS or use the photo fallback button.";
      } else {
        iosNote.textContent = "iOS mode: use Start Camera from a tap, and if blocked try Switch Front/Back or Use Photo.";
      }
    }

    function setHint(text, type = "info") {
      hint.textContent = text;
      hint.className = `small ${type === "error" ? "err" : ""}`;
    }

    function refreshThresholdStatus() {
      const scoreThreshold = Number(scoreInput.value) || 1.5;
      scoreThrStatus.textContent = `Score thr: ${scoreThreshold.toFixed(2)}`;
    }

    function getActiveFrameMetrics() {
      if (
        photoPreview.style.display !== "none" &&
        photoPreview.naturalWidth > 0 &&
        photoPreview.naturalHeight > 0
      ) {
        return {
          srcW: photoPreview.naturalWidth,
          srcH: photoPreview.naturalHeight,
          dstW: photoPreview.clientWidth,
          dstH: photoPreview.clientHeight
        };
      }
      if (video.videoWidth > 0 && video.videoHeight > 0) {
        return {
          srcW: video.videoWidth,
          srcH: video.videoHeight,
          dstW: video.clientWidth,
          dstH: video.clientHeight
        };
      }
      return null;
    }

    function drawBoxes(boxes) {
      const m = getActiveFrameMetrics();
      if (!m) return;
      overlay.width = m.dstW;
      overlay.height = m.dstH;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#22c55e";
      ctx.fillStyle = "#22c55e";
      ctx.font = "14px Segoe UI";

      // object-fit: cover mapping (handles portrait/landscape cropping correctly)
      const coverScale = Math.max(overlay.width / m.srcW, overlay.height / m.srcH);
      const drawW = m.srcW * coverScale;
      const drawH = m.srcH * coverScale;
      const offsetX = (drawW - overlay.width) / 2;
      const offsetY = (drawH - overlay.height) / 2;

      for (const b of boxes) {
        const x = b.x1 * coverScale - offsetX;
        const y = b.y1 * coverScale - offsetY;
        const w = (b.x2 - b.x1) * coverScale;
        const h = (b.y2 - b.y1) * coverScale;
        ctx.strokeRect(x, y, w, h);
        let label = Number(b.score || 0).toFixed(2);
        if (b.name) {
          const rc = Number(b.name_confidence || 0).toFixed(2);
          label = `${b.name} (${rc})`;
        }
        const detScore = Number(b.score || 0).toFixed(2);
        const topY = Math.max(14, y - 6);
        ctx.fillText(label, x + 4, topY);
        const scoreText = `det:${detScore}`;
        const scoreWidth = ctx.measureText(scoreText).width;
        ctx.fillText(scoreText, x + Math.max(4, w - scoreWidth - 4), topY);
      }
    }

    function connectWs() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      ws = new WebSocket(wsUrl());
      ws.onopen = () => {
        connStatus.textContent = "WS: connected";
        connStatus.className = "status-item ok";
        inFlight = false;
        trySendLatest();
      };
      ws.onclose = (evt) => {
        connStatus.textContent = `WS: disconnected (code ${evt.code})`;
        connStatus.className = "status-item warn";
        inFlight = false;
        if (shouldRun) reconnectTimer = setTimeout(connectWs, 900);
      };
      ws.onerror = () => {
        connStatus.textContent = "WS: error";
        connStatus.className = "status-item warn";
        inFlight = false;
      };
      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        inFlight = false;
        if (msg.error) {
          connStatus.textContent = `WS error: ${msg.error}`;
          connStatus.className = "status-item warn";
          trySendLatest();
          return;
        }
        lastBoxes = msg.boxes || [];
        drawBoxes(lastBoxes);
        inferStatus.textContent = `Inference: ${msg.infer_ms ?? "-"} ms`;
        detStatus.textContent = `Detections: ${msg.final_detections ?? 0} (raw: ${msg.raw_positives ?? 0})`;
        trySendLatest();
      };
    }

    function trySendLatest() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (inFlight || !latestFrameDataUrl) return;

      const scoreThreshold = Number(scoreInput.value) || 1.5;
      const recognitionThreshold = Number(recognitionThresholdInput.value) || 0.58;
      const recognitionMinMargin = Number(recognitionMarginInput.value) || 0.16;
      const image = latestFrameDataUrl;
      const origWidth = latestOrigWidth || video.videoWidth;
      const origHeight = latestOrigHeight || video.videoHeight;
      latestFrameDataUrl = null;
      latestOrigWidth = 0;
      latestOrigHeight = 0;
      frameId += 1;
      inFlight = true;

      const profile = speedProfile.value;
      let detectorParams = {
        target_width: 150,
        step: 6,
        scale_step: 0.3,
        min_scale: 0.8,
        max_scale: 2.2
      };
      if (profile === "turbo") {
        detectorParams = {
          target_width: 120,
          step: 8,
          scale_step: 0.4,
          min_scale: 0.9,
          max_scale: 2.0
        };
      } else if (profile === "quality") {
        detectorParams = {
          target_width: 180,
          step: 4,
          scale_step: 0.2,
          min_scale: 0.7,
          max_scale: 2.8
        };
      }

      ws.send(JSON.stringify({
        frame_id: frameId,
        image,
        orig_width: origWidth,
        orig_height: origHeight,
        ...detectorParams,
        score_threshold: scoreThreshold,
        recognition_threshold: recognitionThreshold,
        recognition_min_margin: recognitionMinMargin,
        enable_recognition: true,
        max_detections: 1,
        min_area_ratio: 0.05
      }));

      sent += 1;
      const now = performance.now();
      if (now - fpsClock > 1000) {
        fpsStatus.textContent = `Send FPS: ${sent}`;
        sent = 0;
        fpsClock = now;
      }
    }

    function startSending() {
      if (timer) clearInterval(timer);
      const interval = Number(intervalInput.value) || 220;
      const quality = Math.min(1, Math.max(0.3, Number(qualityInput.value) || 0.65));

      timer = setInterval(() => {
        if (!video.videoWidth || !video.videoHeight) return;

        const sendWidth = isIOS ? 256 : 224;
        const sendScale = Math.min(1, sendWidth / video.videoWidth);
        captureCanvas.width = Math.max(1, Math.round(video.videoWidth * sendScale));
        captureCanvas.height = Math.max(1, Math.round(video.videoHeight * sendScale));
        cctx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

        latestFrameDataUrl = captureCanvas.toDataURL("image/jpeg", quality);
        latestOrigWidth = video.videoWidth;
        latestOrigHeight = video.videoHeight;
        trySendLatest();
      }, interval);
    }

    function stopTracksOnly() {
      if (stream) {
        for (const t of stream.getTracks()) t.stop();
      }
      stream = null;
      video.srcObject = null;
    }

    async function startCamera(facingMode = currentFacingMode) {
      stopTracksOnly();
      photoPreview.style.display = "none";
      video.style.display = "block";
      const constraints = {
        audio: false,
        video: {
          facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();
      currentFacingMode = facingMode;
      setHint(`Camera started (${facingMode === "environment" ? "back" : "front"})`);
    }

    async function start() {
      shouldRun = true;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Camera API not available on this browser.");
      }
      await startCamera(currentFacingMode);
      if (!ws || ws.readyState > 1) connectWs();
      startSending();
    }

    async function switchCamera() {
      if (!shouldRun) {
        setHint("Start camera first, then switch lens.", "error");
        return;
      }
      const nextMode = currentFacingMode === "user" ? "environment" : "user";
      try {
        await startCamera(nextMode);
      } catch (err) {
        setHint(`Switch failed: ${err.message}`, "error");
      }
    }

    function stop() {
      shouldRun = false;
      if (timer) clearInterval(timer);
      timer = null;
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = null;
      inFlight = false;
      latestFrameDataUrl = null;
      latestOrigWidth = 0;
      latestOrigHeight = 0;
      stopTracksOnly();
      photoPreview.style.display = "none";
      video.style.display = "block";
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      lastBoxes = [];
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();
      ws = null;
      connStatus.textContent = "WS: disconnected";
      connStatus.className = "status-item warn";
      inferStatus.textContent = "Inference: - ms";
      detStatus.textContent = "Detections: 0";
      setHint("Stopped");
    }

    function sendStillImageDataUrl(dataUrl, imgWidth, imgHeight) {
      latestFrameDataUrl = dataUrl;
      latestOrigWidth = imgWidth;
      latestOrigHeight = imgHeight;
      if (!ws || ws.readyState > 1) {
        connectWs();
      } else {
        trySendLatest();
      }
    }

    function handlePhotoFile(file) {
      if (!file) return;
      stopTracksOnly();
      const img = new Image();
      const reader = new FileReader();
      reader.onload = () => {
        img.onload = () => {
          photoPreview.src = reader.result;
          photoPreview.style.display = "block";
          video.style.display = "none";
          const sendWidth = 150;
          const scale = Math.min(1, sendWidth / img.width);
          captureCanvas.width = Math.max(1, Math.round(img.width * scale));
          captureCanvas.height = Math.max(1, Math.round(img.height * scale));
          cctx.drawImage(img, 0, 0, captureCanvas.width, captureCanvas.height);
          const jpeg = captureCanvas.toDataURL("image/jpeg", 0.75);
          sendStillImageDataUrl(jpeg, img.width, img.height);
          setHint("Photo sent to model");
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    window.addEventListener("resize", () => drawBoxes(lastBoxes));

    startBtn.addEventListener("click", () => start().catch((err) => {
      connStatus.textContent = `Camera error: ${err.message}`;
      connStatus.className = "status-item warn";
      setHint(`Camera error: ${err.message}`, "error");
    }));
    switchBtn.addEventListener("click", switchCamera);
    stopBtn.addEventListener("click", stop);
    photoBtn.addEventListener("click", () => photoInput.click());
    photoInput.addEventListener("change", (evt) => {
      const file = evt.target.files && evt.target.files[0];
      handlePhotoFile(file);
      photoInput.value = "";
    });
    intervalInput.addEventListener("change", () => stream && startSending());
    qualityInput.addEventListener("change", () => stream && startSending());
    scoreInput.addEventListener("change", () => {
      refreshThresholdStatus();
      stream && startSending();
    });
    recognitionThresholdInput.addEventListener("change", () => stream && startSending());
    recognitionMarginInput.addEventListener("change", () => stream && startSending());
    speedProfile.addEventListener("change", () => setHint(`Profile: ${speedProfile.value}`));

    showIOSHints();
    refreshThresholdStatus();
    setHint("Tap Start Camera to begin.");
  </script>
</body>
</html>
